# fly.toml — FanOps
#
# Región: 'mad' (Madrid). La app y la base de datos deben estar en la misma región o
# cerca; con los socios en España, Madrid deja el servidor a ~10 ms en vez de los ~40 ms
# de Frankfurt.
#
# IMPORTANTE: en fly.toml NO existe interpolación de secretos ({{ secrets.X }} no se
# sustituye por nada). Los secretos creados con `fly secrets set` se inyectan en el
# contenedor como variables de entorno con su mismo nombre, así que basta con nombrarlos
# igual que las variables que lee application.yml. En [env] van solo valores no sensibles.
#
# Despliegue completo paso a paso: ver DESPLIEGUE.md

app = 'fanops'
primary_region = 'mad'

# La JVM en 1 GB va justa en los picos (build de Hibernate, exportación de Excel con POI).
# El swap evita que el kernel mate el proceso en lugar de tragarse un GC más lento.
swap_size_mb = 512

[build]

[env]
  # --- Esquema ---
  # 'update' para el primer arranque contra una base de datos recién restaurada; una vez
  # el esquema está estable, pasar a 'validate': 'update' compara todo el metamodelo
  # contra la base de datos en cada arranque y eso son decenas de idas y vueltas.
  SPRING_JPA_DDL_AUTO = 'update'

  # --- URL pública (enlaces de emails y WhatsApp) ---
  # Cambiar al dominio propio en cuanto esté configurado con `fly certs add`.
  PUBLIC_BASE_URL = 'https://fanops.fly.dev'

  # --- Correo ---
  # En Fly no hay bloqueo de puertos SMTP (eso era una limitación del plan gratuito de
  # Render), así que se puede usar 'smtp' con SMTP_*; se deja 'resend' por continuidad.
  APP_EMAIL_PROVEEDOR = 'resend'
  MAIL_FROM_NAME = 'FanOps'
  MAIL_ACTIVE = 'true'

  # --- WhatsApp (desactivado hasta tener credenciales de Meta) ---
  WHATSAPP_ENABLED = 'false'

  # --- Logs ---
  # En desarrollo el paquete de la aplicación va a DEBUG; en el despliegue sobra.
  LOG_LEVEL_APP = 'INFO'

  # --- Pool de conexiones ---
  # Una sola máquina con poca concurrencia: un pool pequeño va mejor que el default de 10
  # y no agota el límite de conexiones del plan de Neon.
  DB_POOL_MAX = '5'
  DB_POOL_MIN = '1'

[http_service]
  internal_port = 8080
  force_https = true

  # Esto es lo que elimina el tiempo de caída: la máquina no se para nunca.
  # Con auto_stop_machines = 'off' y min_machines_running = 1 no hay arranque en frío
  # y el SorteoCarnetScheduler (@Scheduled cada minuto) se ejecuta de verdad siempre.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 150
    hard_limit = 250

  # El health check de Spring incluye el indicador de base de datos, así que este ping
  # cada 30 s también mantiene despierto el compute de Neon (que si no se suspende a los
  # ~5 min de inactividad y añade ~1 s a la primera consulta).
  # Si en algún momento interesa NO tocar la base de datos en cada check, cambiar la ruta
  # a '/management/health/liveness', que está configurada en application.yml.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '90s'
    method = 'GET'
    path = '/management/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
