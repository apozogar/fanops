# fly.toml app configuration file generated for pblb on 2025-10-22T15:13:12Z
#
# Despliegue (una sola vez, con flyctl instalado):
#   1. Crear la base de datos PostgreSQL gestionada:
#        fly postgres create
#      (anota el nombre de la app de la BD, p. ej. "pblb-db")
#   2. Conectarla a esta app (inyecta la variable DATABASE_URL):
#        fly postgres attach pblb-db --app pblb
#   3. Configurar los secretos:
#        fly secrets set \
#          APP_JWT_SECRET="<base64 de al menos 32 bytes, generarlo con: openssl rand -base64 48>" \
#          SMTP_HOST="..." SMTP_PORT=587 SMTP_USERNAME="..." SMTP_PASSWORD="..." \
#          MAIL_FROM_ADDRESS="noreply@tudominio.com" \
#          WHATSAPP_ENABLED="false" WHATSAPP_PHONE_NUMBER_ID="" WHATSAPP_ACCESS_TOKEN="" \
#          SPRING_JPA_DDL_AUTO="update"
#   4. Desplegar:
#        fly deploy
#
# Nota: los secretos seteados con `fly secrets set` están disponibles como variables
# de entorno en el contenedor y pueden referenciarse en [env] con {{ secrets.NOMBRE }}.

app = 'pblb'
primary_region = 'iad'

[build]

[env]
  # Base de datos (la URL la inyecta `fly postgres attach`)
  SPRING_DATASOURCE_URL = "{{ secrets.DATABASE_URL }}"
  # JPA: usa 'update' para la primera subida; después pasa a 'validate'
  SPRING_JPA_DDL_AUTO = "{{ secrets.SPRING_JPA_DDL_AUTO }}"
  # JWT: secreto para firmar tokens (obligatorio cambiarlo en producción)
  APP_JWT_SECRET = "{{ secrets.APP_JWT_SECRET }}"
  # Correo SMTP
  SMTP_HOST = "{{ secrets.SMTP_HOST }}"
  SMTP_PORT = "{{ secrets.SMTP_PORT }}"
  SMTP_USERNAME = "{{ secrets.SMTP_USERNAME }}"
  SMTP_PASSWORD = "{{ secrets.SMTP_PASSWORD }}"
  MAIL_FROM_ADDRESS = "{{ secrets.MAIL_FROM_ADDRESS }}"
  # WhatsApp (dejar desactivado hasta tener credenciales de Meta)
  WHATSAPP_ENABLED = "{{ secrets.WHATSAPP_ENABLED }}"
  WHATSAPP_PHONE_NUMBER_ID = "{{ secrets.WHATSAPP_PHONE_NUMBER_ID }}"
  WHATSAPP_ACCESS_TOKEN = "{{ secrets.WHATSAPP_ACCESS_TOKEN }}"
  # URL pública para enlaces en emails/WhatsApp (p. ej. https://pblb.fly.dev)
  PUBLIC_BASE_URL = "{{ secrets.PUBLIC_BASE_URL }}"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
