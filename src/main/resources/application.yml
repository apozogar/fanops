spring:
  application:
    name: fanops

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fanops}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:toor}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}  # 'update' para dev; en producción usa 'validate' o migraciones
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Hibernate (ddl-auto: update) sigue gestionando el resto de tablas por ahora;
    # Liquibase solo controla, de momento, la tabla "roles" y sus seeds.

  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:ffc01dec03cf95}
    password: ${SMTP_PASSWORD:f7d9848479d07f}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8090}

logging:
  level:
    root: INFO
    com.softwells.fanops: DEBUG

# Configuraciones de Actuator
management:
  endpoints:
    web:
      base-path: /management # Mueve todos los endpoints a /management (ej: /management/health)
      exposure:
        include: health, info # Exponemos explícitamente los endpoints que queremos
  health:
    # El indicador del correo abre una conexión al host SMTP y lo cuenta como salud de la
    # aplicación. En Render eso es contraproducente: con los puertos SMTP bloqueados daría DOWN
    # y el health check del servicio (healthCheckPath) lo reiniciaría en bucle, aunque la
    # aplicación esté perfectamente. Si el correo falla, se ve en el error del envío.
    mail:
      enabled: false

# Configuraciones específicas de la aplicación
app:
  security:
    jwt:
      # OBLIGATORIO: configura APP_JWT_SECRET en producción (base64, mínimo 32 bytes).
      secret: ${APP_JWT_SECRET:eW91ci1zdXBlci1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1hbmQtc2VjdXJlLWFuZC1hdC1sZWFzdC0yNTYtYml0cw==}
      expiration: ${APP_JWT_EXPIRATION:1209600000}  # 14 dias en milisegundos
  # Base URL pública de la aplicación (para enlaces en emails/WhatsApp).
  # En Fly.io se puede inyectar con FLY_APP_URL.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5300}
  # Bootstrap del primer usuario superadmin (solo se crea si no existe ya ningún
  # usuario con ROLE_SUPERADMIN). OBLIGATORIO cambiar estos valores en producción
  # vía variables de entorno, y cambiar la contraseña tras el primer login.
  superadmin:
    email: ${APP_SUPERADMIN_EMAIL:superadmin@fanops.local}
    password: ${APP_SUPERADMIN_PASSWORD:CambiaEstaClave123!}
  # Vinculación de una cuenta nueva con fichas de socio que ya están en el listado de la peña:
  # horas de validez del enlace de un solo uso que se envía al correo de la ficha.
  vinculacion:
    expiracion-horas: ${APP_VINCULACION_EXPIRACION_HORAS:48}

  # Transporte del correo saliente.
  #   smtp  -> relay SMTP clásico (desarrollo con Mailtrap, o cualquier proveedor en un plan
  #            de pago de Render).
  #   brevo -> API HTTP de Brevo, que sale por el 443. Es la única opción en el plan gratuito
  #            de Render, que bloquea los puertos SMTP (25, 465 y 587).
  email:
    proveedor: ${APP_EMAIL_PROVEEDOR:smtp}
    remitente-nombre: ${MAIL_FROM_NAME:FanOps}
    brevo:
      url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
      api-key: ${BREVO_API_KEY:}

# Dirección de correo para el remitente (email real del dominio en producción)
mail:
  active: false
  from:
    address: ${MAIL_FROM_ADDRESS:noreply@fanops.local}

# Notificaciones por WhatsApp (Meta Business Cloud API)
whatsapp:
  # Si está desactivado o faltan credenciales, las notificaciones se envían solo por email
  enabled: ${WHATSAPP_ENABLED:false}
  api-version: ${WHATSAPP_API_VERSION:v21.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
