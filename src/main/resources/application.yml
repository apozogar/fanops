spring:
  application:
    name: fanops

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fanops}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:toor}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Una sola instancia con poca concurrencia: un pool pequeño rinde mejor que el
      # default de 10 y deja conexiones libres en el Postgres compartido del servidor.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 10000
      idle-timeout: 300000
      # Por debajo de los cortes habituales de conexiones ociosas, para que sea Hikari quien
      # recicle la conexión y no el servidor quien la cierre en mitad de una consulta.
      max-lifetime: 900000
      keepalive-time: 120000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # OJO: se deja en 'true' (el default de Spring Boot) a propósito. Ponerlo a false
    # libera la conexión antes y es lo recomendado, pero aquí los controllers serializan
    # entidades JPA directamente, así que las colecciones perezosas se cargan durante la
    # serialización, ya fuera de la transacción: apagarlo sin repasar endpoint por endpoint
    # provocaría LazyInitializationException en producción. Se expone como variable para
    # poder probarlo en un entorno de pruebas antes de cambiar el default.
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:true}
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}  # 'update' para dev; en producción usa 'validate' o migraciones
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Hibernate (ddl-auto: update) sigue gestionando el resto de tablas por ahora;
    # Liquibase solo controla, de momento, la tabla "roles" y sus seeds.

  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:ffc01dec03cf95}
    password: ${SMTP_PASSWORD:f7d9848479d07f}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8090}
  # Los bundles de Angular y las respuestas JSON viajan sin comprimir si no se activa.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024
  # Detrás del proxy inverso (Caddy en el VPS) la petición llega por HTTP con las cabeceras
  # X-Forwarded-*; sin esto Spring cree que el esquema es http y genera enlaces incorrectos.
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    # DEBUG en desarrollo; en el despliegue se baja a INFO con LOG_LEVEL_APP, porque cada
    # línea de log cuesta tiempo de CPU y llena el almacenamiento de logs sin aportar nada
    # cuando todo va bien.
    com.softwells.fanops: ${LOG_LEVEL_APP:DEBUG}

# Configuraciones de Actuator
management:
  endpoints:
    web:
      base-path: /management # Mueve todos los endpoints a /management (ej: /management/health)
      exposure:
        include: health, info # Exponemos explícitamente los endpoints que queremos
  info:
    # build-info.properties lo genera el build de Maven (ver pom.xml, incluye el commit como
    # propiedad adicional): sin esto /management/info no tendría de dónde sacar la versión
    # desplegada.
    build:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # /management/health sigue comprobando la base de datos, que es lo que queremos
        # para vigilar el despliegue a mano. /management/health/liveness solo mira que el
        # proceso esté vivo: es el que usa el healthcheck de Docker (deploy/docker-compose.yml),
        # para que un corte de la base de datos no haga reiniciar la aplicación en bucle.
        liveness:
          include: livenessState
  health:
    # El indicador del correo abre una conexión al host SMTP y lo cuenta como salud de la
    # aplicación: un proveedor de correo caído pondría la aplicación en DOWN aunque esté
    # perfectamente. Si el correo falla, se ve en el error del envío.
    mail:
      enabled: false

# Configuraciones específicas de la aplicación
app:
  security:
    jwt:
      # OBLIGATORIO: configura APP_JWT_SECRET en producción (base64, mínimo 32 bytes).
      secret: ${APP_JWT_SECRET:eW91ci1zdXBlci1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1hbmQtc2VjdXJlLWFuZC1hdC1sZWFzdC0yNTYtYml0cw==}
      expiration: ${APP_JWT_EXPIRATION:1209600000}  # 14 dias en milisegundos
  # Base URL pública de la aplicación (enlaces de los correos y vista previa en WhatsApp).
  # En producción, la HTTPS real del dominio (PUBLIC_BASE_URL en deploy/.env).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5300}
  # Bootstrap del primer usuario superadmin (solo se crea si no existe ya ningún
  # usuario con ROLE_SUPERADMIN). OBLIGATORIO cambiar estos valores en producción
  # vía variables de entorno, y cambiar la contraseña tras el primer login.
  superadmin:
    email: ${APP_SUPERADMIN_EMAIL:superadmin@fanops.local}
    password: ${APP_SUPERADMIN_PASSWORD:CambiaEstaClave123!}
  # Vinculación de una cuenta nueva con fichas de socio que ya están en el listado de la peña:
  # horas de validez del enlace de un solo uso que se envía al correo de la ficha.
  vinculacion:
    expiracion-horas: ${APP_VINCULACION_EXPIRACION_HORAS:48}

  # Transporte del correo saliente.
  #   smtp   -> relay SMTP clásico (desarrollo con Mailtrap, o cualquier proveedor: en el VPS
  #             los puertos SMTP de salida no están bloqueados).
  #   brevo  -> API HTTP de Brevo, que sale por el 443. Útil donde los puertos SMTP
  #             (25, 465 y 587) estén bloqueados.
  #   resend -> API HTTP de Resend (https://resend.com), también por el 443. Alternativa más
  #             simple de configurar: una única API key, y para pruebas se puede enviar desde
  #             onboarding@resend.dev sin verificar ningún dominio.
  email:
    proveedor: ${APP_EMAIL_PROVEEDOR:resend}
    remitente-nombre: ${MAIL_FROM_NAME:FanOps}
    brevo:
      url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
      api-key: ${BREVO_API_KEY:}
    resend:
      url: ${RESEND_API_URL:https://api.resend.com/emails}
      # Sin valor por defecto a propósito: la clave se inyecta por entorno
      # (RESEND_API_KEY en deploy/.env) y nunca se commitea. Si falta, el envío
      # simplemente no sale y queda registrado (ver ResendEmailSender).
      api-key: ${RESEND_API_KEY:}

# Dirección de correo para el remitente (email real del dominio en producción)
mail:
  active: ${MAIL_ACTIVE:true}
  from:
    address: ${MAIL_FROM_ADDRESS:noreply@fanops.local}

# Notificaciones por WhatsApp (Meta Business Cloud API)
whatsapp:
  # Si está desactivado o faltan credenciales, las notificaciones se envían solo por email
  enabled: ${WHATSAPP_ENABLED:false}
  api-version: ${WHATSAPP_API_VERSION:v21.0}
  # ID de la cuenta de WhatsApp Business (WABA): permite crear sola la plantilla genérica
  waba-id: ${WHATSAPP_WABA_ID:}
  # Con plantilla el aviso llega siempre; con false se manda texto libre (solo dentro de 24 h)
  usar-plantilla: ${WHATSAPP_USAR_PLANTILLA:true}
  plantilla:
    nombre: ${WHATSAPP_PLANTILLA_NOMBRE:aviso_lista_espera}
    idioma: ${WHATSAPP_PLANTILLA_IDIOMA:es}
    crear-al-arrancar: ${WHATSAPP_PLANTILLA_CREAR:true}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
