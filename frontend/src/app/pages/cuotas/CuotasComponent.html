<div class="card">
    <p-toolbar class="mb-4">
        <ng-template pTemplate="left">
            <button foButton variant="primary" (click)="abrirNuevo()">
                <fo-icon name="anadir" />
                <span>Nueva Cuota</span>
            </button>
        </ng-template>
    </p-toolbar>
    <p-table [value]="cuotas" [rows]="10" [paginator]="true"
             [rowHover]="true" dataKey="id" [loading]="loading">
        <ng-template pTemplate="header">
            <tr>
                <th>Socio</th>
                <th>Monto</th>
                <th>Vencimiento</th>
                <th>Estado</th>
                <th>Período</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cuota>
            <tr>
                <td>{{ cuota.socioNombre }}</td>
                <td>{{ cuota.monto | currency:'EUR' }}</td>
                <td>{{ cuota.fechaVencimiento | date:'dd/MM/yyyy' }}</td>
                <td>
                    <p-tag [severity]="getEstadoSeverity(cuota.estado)"
                           [value]="cuota.estado"></p-tag>
                </td>
                <td>{{ cuota.periodo }}</td>
                <td>
                    <div class="flex items-center gap-1.5">
                        <button foButton variant="ghost" size="icon-sm" class="rounded-full"
                                *ngIf="cuota.estado === 'PENDIENTE'"
                                (click)="marcarComoPagada(cuota)"
                                aria-label="Marcar como pagada"
                        ><fo-icon name="check" [size]="16" /></button>
                        <button foButton variant="ghost" size="icon-sm" class="rounded-full"
                                (click)="editarCuota(cuota)" aria-label="Editar cuota"
                        ><fo-icon name="editar" [size]="16" /></button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
