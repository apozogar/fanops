<div class="card">
    <p-toast />
    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <div class="flex flex-wrap gap-2">
                <button foButton variant="secondary" size="icon" (click)="cargar()" pTooltip="Refrescar" tooltipPosition="top" aria-label="Refrescar">
                    <fo-icon name="refrescar" />
                </button>
            </div>
        </ng-template>
    </p-toolbar>

    <p-table
        [value]="accesos"
        [rows]="20"
        [paginator]="true"
        [loading]="loading"
        [rowHover]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} accesos"
        [showCurrentPageReport]="true"
        class="mt-4"
    >
        <ng-template pTemplate="header">
            <tr>
                <th scope="col">Fecha</th>
                <th scope="col">Email</th>
                <th scope="col">Resultado</th>
                <th scope="col" class="hidden md:table-cell">IP</th>
                <th scope="col" class="hidden lg:table-cell">Navegador</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-acceso>
            <tr>
                <td>{{ acceso.fecha | date: 'dd/MM/yyyy HH:mm:ss' }}</td>
                <td>{{ acceso.email }}</td>
                <td>
                    <p-tag [severity]="acceso.exito ? 'success' : 'danger'"
                           [value]="acceso.exito ? 'Correcto' : 'Fallido'"></p-tag>
                </td>
                <td class="hidden md:table-cell">{{ acceso.ip || '—' }}</td>
                <td class="hidden lg:table-cell">
                    <span class="text-xs text-muted-color" [pTooltip]="acceso.userAgent" tooltipPosition="top">
                        {{ acceso.userAgent || '—' }}
                    </span>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-6">Todavía no hay accesos registrados.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
