<fo-auth-shell title="Inicia sesión" subtitle="Accede con tu cuenta para gestionar tu peña.">
    <!-- ngSubmit y no (click) en el botón: así el teclado del móvil muestra "Ir" y envía el
         formulario, que es lo que antes se parcheaba a mano con (keyup.enter) en cada campo. -->
    <form (ngSubmit)="login()">
        <div class="space-y-4">
            <div>
                <label for="email" class="mb-1.5 block text-sm font-medium text-ink">Email</label>
                <input foInput id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="tu@email.com" [invalid]="!!error" [(ngModel)]="email" />
            </div>

            <div>
                <div class="mb-1.5 flex items-baseline justify-between gap-3">
                    <label for="password" class="block text-sm font-medium text-ink">Contraseña</label>
                    <a [routerLink]="penaPublica.ruta('auth', 'forgot-password')" class="text-sm font-medium text-accent hover:underline">¿La olvidaste?</a>
                </div>
                <fo-password inputId="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" [invalid]="!!error" [(ngModel)]="password" />
            </div>
        </div>

        @if (error) {
            <p class="mt-4 flex items-start gap-2 rounded-token bg-danger-soft px-3 py-2.5 text-sm text-danger-soft-fg" role="alert">
                <fo-icon name="error" [size]="17" class="mt-0.5" />
                <span>{{ error }}</span>
            </p>
        }

        <button foButton variant="primary" size="lg" type="submit" class="mt-6 w-full" [loading]="loading" [disabled]="loading">
            <span>Iniciar sesión</span>
        </button>
    </form>

    <div authFooter class="text-sm text-ink-muted">
        ¿Todavía no tienes cuenta?
        <a [routerLink]="penaPublica.ruta('auth', 'register')" class="font-medium text-accent hover:underline">Regístrate</a>
    </div>
</fo-auth-shell>
