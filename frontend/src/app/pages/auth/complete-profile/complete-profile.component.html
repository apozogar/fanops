<fo-auth-shell width="lg" icon="socio" title="Un último paso" subtitle="Completa tu ficha de socio. Puedes dejarlo para más tarde y rellenarla desde tu área personal.">
    @if (socio) {
        <form #profileForm="ngForm" (ngSubmit)="saveProfile()">
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label for="dni" class="mb-1.5 block text-sm font-medium text-ink">DNI</label>
                    <input foInput id="dni" name="dni" type="text" autocapitalize="characters" placeholder="00000000A" [(ngModel)]="socio.dni" required />
                </div>

                <div>
                    <label for="fechaNacimiento" class="mb-1.5 block text-sm font-medium text-ink">Fecha de nacimiento</label>
                    <p-datepicker inputId="fechaNacimiento" name="fechaNacimiento" [(ngModel)]="socio.fechaNacimiento" [showIcon]="true" [fluid]="true" dateFormat="dd/mm/yy" required />
                </div>

                <div class="sm:col-span-2">
                    <label for="direccion" class="mb-1.5 block text-sm font-medium text-ink">Dirección</label>
                    <input foInput id="direccion" name="direccion" type="text" autocomplete="street-address" placeholder="Calle, número, piso..." [(ngModel)]="socio.direccion" />
                </div>

                <div>
                    <label for="poblacion" class="mb-1.5 block text-sm font-medium text-ink">Población</label>
                    <input foInput id="poblacion" name="poblacion" type="text" autocomplete="address-level2" placeholder="Tu población" [(ngModel)]="socio.poblacion" />
                </div>

                <div>
                    <label for="provincia" class="mb-1.5 block text-sm font-medium text-ink">Provincia</label>
                    <input foInput id="provincia" name="provincia" type="text" autocomplete="address-level1" placeholder="Tu provincia" [(ngModel)]="socio.provincia" />
                </div>

                <div>
                    <label for="codigoPostal" class="mb-1.5 block text-sm font-medium text-ink">Código postal</label>
                    <input foInput id="codigoPostal" name="codigoPostal" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="41000" [(ngModel)]="socio.codigoPostal" />
                </div>

                <div>
                    <label for="telefono" class="mb-1.5 block text-sm font-medium text-ink">Teléfono</label>
                    <input foInput id="telefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="600 000 000" [(ngModel)]="socio.telefono" />
                </div>

                <div class="sm:col-span-2">
                    <label for="numeroCuenta" class="mb-1.5 block text-sm font-medium text-ink">Número de cuenta (IBAN)</label>
                    <input foInput id="numeroCuenta" name="numeroCuenta" type="text" autocapitalize="characters" spellcheck="false" placeholder="ES00 0000 0000 0000 0000 0000" [(ngModel)]="socio.numeroCuenta" />
                    <p class="mt-1.5 text-xs text-ink-muted">Solo se usa para el cobro de las cuotas de socio.</p>
                </div>
            </div>

            @if (error) {
                <p class="mt-4 flex items-start gap-2 rounded-token bg-danger-soft px-3 py-2.5 text-sm text-danger-soft-fg" role="alert">
                    <fo-icon name="error" [size]="17" class="mt-0.5" />
                    <span>{{ error }}</span>
                </p>
            }

            <!-- La acción principal va primera en el DOM y se recoloca a la derecha en escritorio:
                 así en móvil (una columna) queda arriba, al alcance del pulgar. -->
            <div class="mt-7 flex flex-col gap-3 sm:flex-row-reverse">
                <button foButton variant="primary" size="lg" type="submit" class="sm:flex-1" [disabled]="profileForm.invalid">Guardar ficha</button>
                <button foButton variant="secondary" size="lg" type="button" class="sm:flex-1" (click)="skip()">Completar más tarde</button>
            </div>
        </form>
    } @else if (error) {
        <!-- El error de carga se pinta aquí y no dentro del formulario: cuando la ficha no llega,
             `socio` sigue nulo y el mensaje quedaba en una rama que nunca se mostraba. -->
        <p class="flex items-start gap-2 rounded-token bg-danger-soft px-3 py-2.5 text-sm text-danger-soft-fg" role="alert">
            <fo-icon name="error" [size]="17" class="mt-0.5" />
            <span>{{ error }}</span>
        </p>
        <button foButton variant="secondary" size="lg" type="button" class="mt-6 w-full" (click)="skip()">Continuar a la aplicación</button>
    } @else {
        <div class="flex items-center gap-3 text-sm text-ink-muted">
            <p-progressSpinner styleClass="!h-6 !w-6" strokeWidth="4" />
            Cargando tu perfil...
        </div>
    }
</fo-auth-shell>
