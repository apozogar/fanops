<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>FanOps</title>
        <base href="/" />
        <!-- viewport-fit=cover es imprescindible para que env(safe-area-inset-*) devuelva
             valores reales en iOS: sin él, la barra de pestañas quedaría bajo el indicador
             de gestos y la cabecera bajo el notch. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- Color de la barra del navegador en móvil, coherente con el tema claro/oscuro. -->
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#101827" media="(prefers-color-scheme: dark)" />
        <link rel="icon" type="image/png" href="assets/logo-fanops.png" />
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
