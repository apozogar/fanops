services:
  - type: web
    name: fanops
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /management/health

    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false   # jdbc:postgresql://ep-super-mode-af4qmaat-pooler.c-2.us-west-2.aws.neon.tech/fanops?sslmode=require&channel_binding=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # contraseña de Neon
      - key: SPRING_JPA_DDL_AUTO
        value: update          # cambia a 'validate' cuando el esquema esté estable
      - key: APP_JWT_SECRET
        generateValue: true    # Render lo genera automáticamente
      - key: PUBLIC_BASE_URL
        value: https://fanops.onrender.com   # ajusta al dominio real
      # --- Correo saliente ---
      # El plan gratuito bloquea la salida a los puertos SMTP (25, 465 y 587), así que con
      # 'plan: free' hay que enviar por la API HTTP de Brevo, que va por el 443. Si se sube el
      # servicio a un plan de pago, se puede volver a SMTP poniendo APP_EMAIL_PROVEEDOR=smtp y
      # rellenando las SMTP_*.
      - key: APP_EMAIL_PROVEEDOR
        value: brevo
      - key: BREVO_API_KEY
        sync: false   # Brevo > SMTP & API > API keys
      - key: MAIL_FROM_ADDRESS
        sync: false   # remitente verificado en Brevo (dominio con SPF y DKIM, o remitente único)
      - key: MAIL_FROM_NAME
        value: FanOps
      # Solo se usan con APP_EMAIL_PROVEEDOR=smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # --- Superadmin inicial (cámbialo tras el primer deploy) ---
      - key: APP_SUPERADMIN_EMAIL
        sync: false
      - key: APP_SUPERADMIN_PASSWORD
        sync: false
      # --- WhatsApp (opcional) ---
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: ""
      - key: WHATSAPP_ACCESS_TOKEN
        value: ""

